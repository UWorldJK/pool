<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width"
  /><title>Pool Expo migration comparison</title
  ><style>
    body {
      font: 16px system-ui;
      background: #f6f7f2;
      color: #253c35;
      margin: 24px;
    }
    label {
      margin-right: 20px;
    }
    select {
      font: inherit;
      padding: 8px;
    }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 24px;
    }
    img {
      width: 100%;
      border: 1px solid #dce2d9;
    }
    h2 {
      font-size: 18px;
    }
    p {
      max-width: 80ch;
    }
    @media (max-width: 700px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <h1>Pool: Next.js baseline and Expo web</h1>
  <p>
    Matching named states and viewport sizes from independent real-user journeys
    on disposable backends. Fictional records differ. Native simulator
    screenshots are not included.
  </p>
  <label
    >Screen
    <select id="screen"></select></label
  ><label
    >Viewport
    <select id="viewport">
      <option>desktop</option>
      <option>phone</option>
    </select></label
  >
  <main>
    <section>
      <h2>Preserved Next.js baseline</h2>
      <img id="before" alt="Next.js baseline" />
    </section>
    <section>
      <h2>Shared React Native Web app</h2>
      <img id="after" alt="Expo web" />
    </section>
  </main>
  <script>
    const names = [
      "authentication",
      "awaiting-handoff",
      "circle",
      "closed-swap",
      "completed",
      "confirmed",
      "declined",
      "empty",
      "expired",
      "family",
      "pending",
      "planning",
      "schedule",
      "uncovered",
    ];
    const screen = document.getElementById("screen"),
      viewport = document.getElementById("viewport"),
      before = document.getElementById("before"),
      after = document.getElementById("after");
    for (const name of names) {
      const option = document.createElement("option");
      option.textContent = name;
      screen.append(option);
    }
    function update() {
      before.src = `baseline/${screen.value}-${viewport.value}.png`;
      after.src = `after/${screen.value}-${viewport.value}.png`;
    }
    screen.onchange = viewport.onchange = update;
    update();
  </script>
</html>

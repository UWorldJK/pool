name: CI

on:
  pull_request:
    branches: [main, lkluge/ci-vercel-delivery, lkluge/auth-session-flow, lkluge/family-circle-membership, lkluge/ride-planning, lkluge/driver-confirmation, lkluge/ride-handoffs, lkluge/driver-replacements]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    # Playwright 1.58.2 supports Ubuntu 24.04; ubuntu-latest now uses 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Validate the PR head itself: this is the revision delivery uploads.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Preserve inherited migration history
        run: node scripts/check-migration-history.mjs
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run check
      - name: Install Auth browser
        run: npx playwright install --with-deps chromium
      - name: Clean and upgrade migrations, generated types, real RLS and Auth/membership/ride/assignment/handoff/replacement browsers
        run: npm run test:auth
      - name: Verify pinned deployment CLI without credentials
        run: |
          npm install --prefix "$RUNNER_TEMP/vercel-cli" --ignore-scripts --no-audit --no-fund vercel@65.4.0
          node scripts/verify-vercel-cli.mjs "$RUNNER_TEMP/vercel-cli/node_modules/vercel/dist/index.js"
      - uses: docker/setup-compose-action@2fe291b7677a45ee1269ec56a42604c143505e7e # v1
        with:
          version: v2.40.3
      - run: bash scripts/validate-compose.sh
      - run: bash scripts/container-smoke.sh

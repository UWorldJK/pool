  <script>
(function (root) {
  'use strict';
  const fresh = () => ({version:3, view:'today', day:22, trip:'moving', claimed:false,
    fridayAvailable:true, fridayDriver:'Sarah Chen', unavailableDriver:null, replacement:null, custom:[],
    alerts:{pickup:true,arrival:true,reminders:true}, theme:'light', sequence:0, logs:[]});
  function replacementReady(r) {
    return r && r.status==='pending' && r.accepted && ['Morgan','Chen','Brooks'].every(f=>r.approvals.includes(f));
  }
  function rideStatus(s) {
    if (s.replacement?.status==='pending') return s.fridayAvailable?'Change pending':'Needs a new driver';
    return s.fridayAvailable?'Driver confirmed':'Needs a new driver';
  }
  function change(state, action, value) {
    const s=JSON.parse(JSON.stringify(state));
    const log=(title,body)=>s.logs.unshift({id:++s.sequence,title,body,time:'Demo · just now'});
    switch(action) {
      case 'trip':
        if (!['moving','delayed','awaiting'].includes(value)||s.trip==='complete') break;
        s.trip=value;
        if(value==='awaiting') log('Sarah reported arrival','Emma’s handoff still needs Alex’s confirmation.');
        break;
      case 'handoff':
        if(s.trip!=='awaiting'||value!==true) break;
        s.trip='complete';log('Emma’s handoff confirmed','Alex confirmed Emma is with them. Sharing for Emma ended.');break;
      case 'unavailable':
        s.unavailableDriver=s.fridayDriver||s.unavailableDriver||'Sarah Chen';s.fridayAvailable=false;s.fridayDriver=null;s.replacement=null;
        log('Friday’s ride needs a new driver',s.unavailableDriver+' is unavailable. No replacement is confirmed.');break;
      case 'request':
        s.replacement={status:'pending',accepted:false,approvals:[]};
        log('David was proposed for Friday','Waiting for David and the Morgan, Chen and Brooks families.');break;
      case 'accept':if(s.replacement?.status==='pending') s.replacement.accepted=true;break;
      case 'approve':
        if(s.replacement?.status==='pending'&&['Morgan','Chen','Brooks'].includes(value)&&!s.replacement.approvals.includes(value)) s.replacement.approvals.push(value);
        break;
      case 'reject':case 'expire':
        if(s.replacement?.status==='pending') {
          s.replacement.status=action==='reject'?'declined':'expired';
          log(action==='reject'?'Replacement declined':'Approval deadline missed',s.fridayAvailable?'Sarah remains available and assigned.':'The ride remains uncovered. A new plan is required.');
        }break;
      case 'cancel':
        s.replacement=null;
        log('Replacement request cancelled',s.fridayAvailable?'Sarah remains assigned.':s.unavailableDriver+' is unavailable. The ride still needs a driver.');break;
      case 'claim':if(value===true){s.claimed=true;log('You’re driving Friday to practice','Alex confirmed 3 passenger seats and required restraints.');}break;
      case 'plan':s.custom.push(value);log('A ride was added',value.name+' · '+(value.driver?'You’re driving.':'Needs a driver.'));break;
      case 'claim-custom':{const ride=s.custom.find(r=>r.id===value);if(ride){ride.driver='Alex Morgan';log('You accepted a ride',ride.name+' · Alex is driving.');}break;}
      case 'view':s.view=value;break;
      case 'day':s.day=Number(value);break;
      case 'theme':s.theme=s.theme==='light'?'dark':'light';break;
      case 'alert':if(Object.hasOwn(s.alerts,value))s.alerts[value]=!s.alerts[value];break;
    }
    if(replacementReady(s.replacement)) {
      s.replacement.status='confirmed';s.fridayAvailable=true;s.fridayDriver='David Brooks';
      log('David is confirmed for Friday','David accepted and all 3 families approved. The new plan is ready.');
    }
    return s;
  }
  const api={fresh,change,rideStatus,replacementReady};
  if(typeof module!=='undefined'&&module.exports)module.exports=api;
  else root.PoolModel=api;
})(typeof globalThis!=='undefined'?globalThis:this);

</script>

 case 'confirm-claim':{if(!$('#capacity').checked){$('#capacity-error').textContent='Confirm seats and required restraints before accepting.';$('#capacity').focus();break;}const id=modalData.id||'fri-to';if(id==='fri-to')update('claim',true);else update('claim-custom',id);close();announce('You’re confirmed. The sample plan is updated.');break;}
 case 'request':update('request',null,'David is proposed. Waiting for his acceptance and each family’s approval.');break;
 case 'approve-own':update('approve','Morgan','You approved David for Emma. Other families make their own choice.');break;
 case 'cancel-request':update('cancel');close();announce(state.fridayAvailable?'Request cancelled. The available driver remains assigned.':'Request cancelled. Friday still needs a new driver.');break;
 case 'confirm-handoff':if(!$('#handoff-check')?.checked){$('#handoff-error').textContent='Confirm Emma is with you before completing the handoff.';$('#handoff-check')?.focus();break;}update('handoff',true);close();announce('Emma’s handoff is confirmed. Her sharing has ended.');break;
 case 'demo-fresh':update('trip','moving','Fresh sample location restored.');break;
 case 'demo-delay':update('trip','delayed','Location delayed. Last update 4 minutes ago. No current ETA.');break;
 case 'demo-arrival':update('trip','awaiting','Sarah reported arrival. Emma’s handoff is still waiting for you.');break;
 case 'demo-unavailable':update('unavailable',null,'Driver unavailable. Friday’s ride home has no confirmed driver.');break;
 case 'demo-accept':update('accept',null,'Demo: David accepted.');break;
 case 'demo-approve':update('approve',el.dataset.family,'Demo: '+el.dataset.family+' family approved.');break;
 case 'demo-reject':update('reject',null,'Replacement declined. The driver plan has been updated.');break;
 case 'demo-expire':update('expire',null,'Demo deadline passed. No replacement was assigned.');break;
 case 'reset':state=PoolModel.fresh();save();close();render();announce('Sample plan reset.');break;
 default:if(['trip','handoff','replacement','contact','plan','invite','privacy','prototype'].includes(a))open(a);
 }});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='ride-form'){const f=e.target;if(!f.reportValidity())return;const data=new FormData(f);if(!['name','pickup','drop'].every(k=>String(data.get(k)).trim())){$('#plan-error').textContent='Add a name, pickup point and destination.';return;}if(data.get('driver')&&!$('#plan-capacity').checked){$('#plan-error').textContent='Confirm seats and required restraints if you’re driving.';$('#plan-capacity').focus();return;}const [h,m]=String(data.get('time')).split(':');const ride={id:'custom-'+Date.now(),day:+data.get('day'),name:String(data.get('name')).trim(),time:`${+h%12||12}:${m} ${+h>=12?'PM':'AM'}`,pickup:String(data.get('pickup')).trim(),drop:String(data.get('drop')).trim(),driver:data.get('driver')||null};state=PoolModel.change(state,'plan',ride);state.day=ride.day;navigate('schedule');announce(ride.driver?'Ride saved. You’re driving.':'Ride saved. A driver is still needed.');}if(e.target.id==='invite-form'&&e.target.reportValidity())open('invite-preview',{email:new FormData(e.target).get('email')});});
$('#dialog').addEventListener('cancel',e=>{e.preventDefault();close();});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();}});
render();

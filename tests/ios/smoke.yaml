appId: dev.pool.prototype
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: pool:///sign-up
- tapOn:
    text: "^Open$"
    optional: true
- assertVisible: Create your Pool account
- assertVisible: Email address
- assertVisible: Password
- assertVisible: I am at least 18 years old.
- takeScreenshot: pool-ios-signup
- stopApp
- launchApp
- openLink: pool:///sign-in
- tapOn:
    text: "^Open$"
    optional: true
- assertVisible: Sign in to Pool
